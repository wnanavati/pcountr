# R-CMD-check — runs on every push and pull request to main and dev.
#
# Three platforms on current R. Windows is not optional here: tilia.R discovers
# the Tilia lookup directory from %LOCALAPPDATA% and C:/ProgramData, and that
# path logic only executes on Windows.
#
# No job needs network access. The Neotoma tests either fail argument
# validation before any request or point pcountr.neotoma_api at
# http://127.0.0.1:1, so CI does not depend on api.neotomadb.org being up.

name: R-CMD-check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # needs: check installs Suggests as well as Imports, which matters
      # because the test suite reaches for withr, xml2, rioja and neotoma2.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"warning"'
